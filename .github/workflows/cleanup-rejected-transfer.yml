name: Remove superseded unverified MSI transfer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-rejected-transfer.yml']
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    if: github.repository == 'hussin0100808-ux/qcontract-releases'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete only the preserved failed-run transfer artifact
        shell: python
        env:
          CLEANUP_TOKEN: ${{ github.token }}
        run: |
          import json, os, urllib.error, urllib.request
          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          assert os.environ.get('GITHUB_REPOSITORY') == 'hussin0100808-ux/qcontract-releases'
          assert os.environ.get('GITHUB_REF') == 'refs/heads/main'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, url):
                  raise RuntimeError('Redirect refused.')
          endpoint = 'https://api.github.com/repos/hussin0100808-ux/qcontract-releases/actions/artifacts/14107588246'
          headers = {'Authorization': 'Bearer ' + os.environ['CLEANUP_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
                     'User-Agent': 'QContract-generated-transfer-cleanup/1'}
          opener = urllib.request.build_opener(NoRedirect())
          def call(method):
              try:
                  with opener.open(urllib.request.Request(endpoint, headers=headers, method=method), timeout=30) as response:
                      data = response.read(65537)
                      assert len(data) <= 65536
                      return response.status, data
              except urllib.error.HTTPError as error:
                  return error.code, b''
          status, data = call('GET')
          if status == 404:
              print('Specified superseded transfer is already absent.')
          else:
              assert status == 200, 'Artifact metadata unavailable.'
              item = json.loads(data)
              assert item['id'] == 14107588246
              assert item['name'] == 'UNVERIFIED-MSI-DO-NOT-INSTALL-43578945004-1'
              assert item['workflow_run']['id'] == 43578945004
              assert item['size_in_bytes'] == 387137676
              assert item['digest'] == 'sha256:f4f7db72ca629f482937e611f078d910b8861dbf13a592ba62292b032779d2da'
              assert call('DELETE')[0] == 204, 'Specified transfer cleanup failed.'
              assert call('GET')[0] == 404, 'Specified transfer still exists.'
              print('Removed only superseded transfer 14107588246; local candidate, draft release and test logs retained.')
          os.environ.pop('CLEANUP_TOKEN', None)
